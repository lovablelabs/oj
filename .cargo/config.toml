# wasm32 builds (crates/oj_wasm): getrandom 0.3+ picks its backend by cfg, and
# in the browser that is the JS crypto API. Native builds are unaffected.
#
# Cargo DISCARDS target rustflags from this file whenever a RUSTFLAGS env var
# is set; if a wasm32 build fails on a missing getrandom backend, unset
# RUSTFLAGS or append this cfg to it.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# Anything cargo runs (tests above all) gets no shared oj store: an empty
# OJ_STORE_DIR turns sharing off, so every cache stays under its app, as
# tests expect, instead of persisting into ~/.cache/oj/store across runs.
# Not forced: a run that sets OJ_STORE_DIR keeps it, and the dev test
# harness points it at its own run dir. `cargo run -p oj -- dev --store=DIR`
# still opts in.
[env]
OJ_STORE_DIR = ""
