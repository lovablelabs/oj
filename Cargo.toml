[workspace]
resolver = "2"
members = [
    "crates/oj_compiler",
    "crates/oj_deno_process",
    "crates/oj_css",
    "crates/oj_diag",
    "crates/oj_env",
    "crates/oj_config",
    "crates/oj_resolver",
    "crates/oj_graph",
    "crates/oj_cache",
    "crates/oj_server",
    "crates/oj",
    "crates/oj_js",
    "crates/oj_stylex",
    "crates/fru",
    "crates/oj_wasm",
    "crates/oj_deno_napi",
    "crates/oj_notify",
    "crates/oj_deno_runtime",
    "crates/oj_deno_snapshots",
    "crates/typecheck/oj_*",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lovablelabs/oj"

[workspace.dependencies]
oj_compiler = { version = "0.3.0", path = "crates/oj_compiler" }
oj_resolver = { version = "0.3.0", path = "crates/oj_resolver" }
oj_graph = { version = "0.3.0", path = "crates/oj_graph" }
