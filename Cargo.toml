oj_js = { version = "0.3.0", path = "crates/oj_js" }
oj_stylex = { version = "0.3.0", path = "crates/oj_stylex" }

# oj-maintained forks of deno_napi 0.190.0 and deno_runtime 0.267.0 (published
# to crates.io under these names), carrying oj's napi finalizer-registry patch:
# the upstream Vec makes reference deregistration a linear scan + shift, which
# goes quadratic under GC when an addon (rolldown bundling a large app) holds
# hundreds of thousands of live references — it dominated one-shot rebundle
# children. See crates/oj_deno_napi/lib.rs. Consumers rename them back via the
# dependency key so `use deno_napi::`/`use deno_runtime::` stay unchanged; a
# published oj resolves them by version from crates.io.
oj_deno_napi = { package = "oj_deno_napi", version = "0.3.0", path = "crates/oj_deno_napi" }
oj_deno_runtime = { package = "oj_deno_runtime", version = "0.3.0", path = "crates/oj_deno_runtime" }

oxc_allocator = "0.155.0"
oxc_parser = "0.155.0"
oxc_ast = "0.155.0"
oxc_ast_visit = "0.155.0"
oxc_span = "0.155.0"
oxc_semantic = "0.155.0"
oxc_transformer = "0.155.0"
oxc_transformer_plugins = "0.155.0"
oxc_minifier = "0.155.0"
oxc_ecmascript = "0.155.0"
oxc_syntax = "0.155.0"
oxc_str = "0.155.0"
oxc_codegen = "0.155.0"
oxc_diagnostics = "0.155.0"
oxc_sourcemap = "9.0.0"
oxc_resolver = "11.24.3"
base64 = "0.22"

anyhow = "1.0.104"
blake3 = "1.8.6"
memchr = "2.8.3"
simdutf8 = "0.1.5"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
# oj-maintained fork of notify 9.0.0-rc.6 (published to crates.io under this
# name), carrying the unreleased upstream FSEvents fix that keeps pending
# events across watch changes. See crates/oj_notify/README.md.
notify = { package = "oj_notify", version = "0.3.0", path = "crates/oj_notify" }
clap = { version = "4.6.6", features = ["derive"] }

# test-only
proptest = "1.9.0"
tempfile = "3.24.0"

# `panic = "abort"` is deliberately NOT set: the engine's `__oj_rpc` bridge
# catches handler panics at the V8 callback boundary (oj_js/src/bridge.rs)
# so a panicking plugin RPC fails one hook instead of the process, and dev
# sessions are long-lived servers — an abort would take the whole dev server
# down with whatever panicked. Unwind tables cost ~9 MB of binary size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1

# Size-optimize the long tail, but keep the dev-loop hot paths at full speed.
[profile.release.package]
oj = { opt-level = 3 }
