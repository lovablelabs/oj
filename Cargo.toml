oj_config = { version = "0.3.0", path = "crates/oj_config" }
oj_server = { version = "0.3.0", path = "crates/oj_server" }
oj_typecheck = { version = "0.3.0", path = "crates/typecheck/oj_typecheck" }
# tsrs:begin (tools/vendor-tsrs.py) deps
