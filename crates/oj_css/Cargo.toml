[package]
name = "oj_css"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CSS pipeline: Lightning CSS transforms, CSS Modules scoping"

[dependencies]
lightningcss = { version = "1.0.0-alpha.72", features = ["browserslist"] }
browserslist-rs = "0.19"
grass = "0.13.4"
serde_json.workspace = true
base64.workspace = true
parcel_sourcemap = "2.1.1"
regex = "1.11"
oxc_resolver.workspace = true
# generic-names / loader-utils hashes for `css.modules.generateScopedName`.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
