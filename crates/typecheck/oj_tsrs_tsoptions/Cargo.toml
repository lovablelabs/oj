# Generated by tools/vendor-tsrs.py from tsrs's crates/tsrs_tsoptions; do not edit by hand.
[package]
name = "oj_tsrs_tsoptions"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "tsrs's tsrs_tsoptions, vendored for oj's type checker"
repository.workspace = true

[lib]
test = false
doctest = false

[lints.rust]
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
raw_borrows_via_references = "warn"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
similar_names = "allow"
too_many_arguments = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
useless_let_if_seq = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
type_complexity = "allow"
struct_field_names = "allow"
many_single_char_names = "allow"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
unnecessary_self_imports = "deny"
try_err = "deny"
error_impl_error = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
infinite_loop = "deny"
map_with_unused_argument_over_ranges = "deny"
unused_result_ok = "deny"
pathbuf_init_then_push = "deny"
pub_underscore_fields = "deny"
non_zero_suggestions = "deny"
precedence_bits = "deny"
iter_on_single_items = "deny"
unused_peekable = "deny"
suspicious_operation_groupings = "deny"
return_and_then = "deny"
redundant_clone = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
assigning_clones = "deny"
cloned_instead_of_copied = "deny"
format_push_string = "deny"
inefficient_to_string = "deny"
needless_collect = "deny"
unnecessary_box_returns = "deny"
rc_buffer = "deny"
vec_box = "deny"
stable_sort_primitive = "deny"
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
inline_always = "deny"
disallowed_types = "deny"
set_contains_or_insert = "deny"
zero_sized_map_values = "deny"
iter_over_hash_type = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
significant_drop_in_scrutinee = "deny"
non_send_fields_in_send_ty = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
as_ptr_cast_mut = "deny"
transmute_ptr_to_ptr = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_macros = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[dependencies]
tsrs_core = { workspace = true }
tsrs_diagnostics = { workspace = true }
tsrs_ast = { workspace = true }
tsrs_scanner = { workspace = true }
tsrs_parser = { workspace = true }
tsrs_vfs = { workspace = true }
tsrs_module = { workspace = true }
rustc-hash = { version = "2" }
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3"] }
