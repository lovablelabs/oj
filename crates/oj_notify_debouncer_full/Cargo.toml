# Fork of rolldown-notify-debouncer-full 0.8.1 (rolldown's publication of
# notify-debouncer-full, https://github.com/notify-rs/notify) maintained for
# oj, carrying one change: the debouncer's thread sleeps while no event is
# queued, where it woke once a tick (a quarter of the debounce delay) to look
# for an event old enough to report, idle or not. Everything else is verbatim
# 0.8.1; the change is in oj.patch. Drop the fork once rolldown's debouncer
# carries it. See README.md.

[package]
edition = "2024"
rust-version = "1.90"
name = "oj_notify_debouncer_full"
version.workspace = true
authors = ["Daniel Faust <hessijames@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rolldown-notify-debouncer-full 0.8.1 maintained for oj: the debouncer thread sleeps while no event is queued instead of waking once a tick. Use upstream notify-debouncer-full unless you need this."
homepage = "https://github.com/notify-rs/notify"
readme = "README.md"
keywords = ["events", "filesystem", "notify", "watch"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lovablelabs/oj"

[features]
crossbeam-channel = ["dep:crossbeam-channel", "rolldown-notify/crossbeam-channel"]
default = ["macos_fsevent"]
flume = ["dep:flume", "rolldown-notify/flume"]
macos_fsevent = ["rolldown-notify/macos_fsevent"]
macos_kqueue = ["rolldown-notify/macos_kqueue"]
serde = ["rolldown-notify-types/serde"]
serialization-compat-6 = ["rolldown-notify/serialization-compat-6"]
web-time = ["rolldown-notify-types/web-time"]

[lib]
name = "notify_debouncer_full"
path = "src/lib.rs"

[dependencies.crossbeam-channel]
version = "0.5.0"
optional = true

[dependencies.flume]
version = "0.12.0"
optional = true

[dependencies.rolldown-file-id]
version = "0.2.12"

[dependencies.rolldown-notify]
version = "11.0.1"

[dependencies.rolldown-notify-types]
version = "2.0.4"

[dependencies.rustc-hash]
version = "2.1.2"

[dependencies.tracing]
version = "0.1.41"

[dependencies.walkdir]
version = "2.4.0"

# Upstream's tests, kept: its state tests check the debouncing itself and
# its integration test runs the thread on real file events.
[dev-dependencies.deser-hjson]
version = "2.2.4"

[dev-dependencies.pretty_assertions]
version = "1.3.0"

[dev-dependencies.rstest]
version = "0.28.0"

[dev-dependencies.serde]
version = "1.0.89"
features = ["derive"]

[dev-dependencies.tempfile]
version = "3.26.0"

# The sources stay upstream's, so they are not held to oj's clippy lints, as
# a registry build would not hold them either.
[lints.rust.deprecated]
level = "allow"
priority = 0

[lints.clippy.all]
level = "allow"
priority = -1
