[package]
name = "oj_stylex"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "StyleX compiler: transforms, rule registry and stylesheet assembly"
# The conformance corpus and pins stay in the repository: upstream-derived
# fixtures keep their own licence and are not part of the published crate.
include = ["src/**", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_str.workspace = true
oxc_codegen.workspace = true
oxc_sourcemap.workspace = true
memchr.workspace = true
blake3.workspace = true
# preserve_order: JS object key order is semantic (alias last-wins); the default
# alphabetizing Map silently reorders keys through every JSON bridge.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
thiserror.workspace = true
ryu-js = "1"
clap.workspace = true
oj_env.workspace = true
