[package]
name = "oj_js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded JavaScript engine: Deno runtime with Node compatibility over the app's node_modules"

[dependencies]
# Piu engine stack (the deno crates on JavaScriptCore; see the workspace
# manifest). Snapshots went with V8: Piu embeds the extension sources
# instead, so there is no snapshots crate and workers boot without a
# startup_snapshot.
piu_core.workspace = true
piu_runtime.workspace = true
# "deno_ast" is required for the CJS-to-ESM translation used when an ES
# module imports a CommonJS package from node_modules.
piu_resolver = { workspace = true, features = ["sync", "deno_ast"] }
piu_node_resolver = { workspace = true, features = ["sync"] }
piu_napi.workspace = true
piu_config.workspace = true
deno_error = "0.7"
deno_media_type = "0.4"
deno_path_util = "0.6"
sys_traits = "0.1"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[build-dependencies]
# Resolver v2 unifies build-dependency features separately from normal
# dependencies. Keeping piu_core here pins the host-side build of piu_core
# (pulled in by build scripts in the dep train, e.g. piu_napi's) to the same
# features as the target-side build.
piu_core.workspace = true

[dev-dependencies]
tempfile.workspace = true
