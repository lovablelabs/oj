[package]
name = "oj_js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded JavaScript engine: Deno runtime with Node compatibility over the app's node_modules"

[dependencies]
deno_core = { version = "0.412", features = ["v8"] }
# oj-maintained forks (napi finalizer-registry patch, see the workspace
# manifest); the dependency keys keep `use deno_runtime::`/`use deno_napi::`
# paths working unchanged.
deno_runtime = { package = "oj_deno_runtime", version = "0.2.1", path = "../oj_deno_runtime" }
# "deno_ast" is required for the CJS-to-ESM translation used when an ES
# module imports a CommonJS package from node_modules.
deno_resolver = { version = "0.90", features = ["sync", "deno_ast"] }
node_resolver = { version = "0.97", features = ["sync"] }
deno_snapshots = "0.74"
deno_napi = { package = "oj_deno_napi", version = "0.2.1", path = "../oj_deno_napi" }
deno_config = "0.109"
deno_error = "0.7"
deno_media_type = "0.4"
deno_path_util = "0.6"
sys_traits = "0.1"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[build-dependencies]
# Resolver v2 unifies build-dependency features separately from normal
# dependencies. Keeping deno_core with "v8" here pins the host-side build of
# deno_core (pulled in by build scripts in the dep train, e.g. deno_napi's)
# to the same features as the target-side build.
deno_core = { version = "0.412", features = ["v8"] }

[dev-dependencies]
tempfile.workspace = true
