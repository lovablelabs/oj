# Fork of deno_process 0.74.0 (https://github.com/denoland/deno, ext/process)
# maintained for oj. Only change: the `oj patch` blocks in lib.rs — every
# non-detached child spawns into its OWN process group and is reported through
# `oj_hook`, so the embedding server can kill entire plugin-spawned trees
# across a self-restart exec or on shutdown. All other source is verbatim
# upstream.

[package]
edition = "2024"
name = "oj_deno_process"
version.workspace = true
authors = ["the Deno authors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "oj's fork of deno_process: child process groups + spawn hook"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lovablelabs/oj"
resolver = "2"

[lib]
path = "lib.rs"

[dependencies.deno_core]
version = "0.412.0"
features = [
    "reactor-tokio",
    "v8_use_custom_libcxx",
]
default-features = false

[dependencies.deno_error]
version = "=0.7.1"

[dependencies.deno_fs]
version = "0.169.0"

[dependencies.deno_io]
version = "0.169.0"

[dependencies.deno_os]
version = "0.76.0"

[dependencies.deno_path_util]
version = "=0.6.4"

[dependencies.deno_permissions]
version = "0.118.0"

[dependencies.deno_signals]
version = "0.50.0"

[dependencies.deno_subprocess_windows]
version = "0.54.0"

[dependencies.libc]
version = "0.2.168"

[dependencies.log]
version = "0.4.28"
features = ["kv"]

[dependencies.memchr]
version = "2.7.4"

[dependencies.rand]
version = "=0.8.5"

[dependencies.serde]
version = "1.0.149"
features = ["derive"]

[dependencies.sys_traits]
version = "0.1.28"
features = [
    "real",
    "winapi",
    "libc",
]

[dependencies.tempfile]
version = "3.4.0"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1.47.1"
features = ["full"]

[target."cfg(unix)".dependencies.nix]
version = "=0.30.1"
features = [
    "signal",
    "process",
]

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Wdk_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI",
    "Win32_UI_Shell",
    "Win32_System_Threading",
]
