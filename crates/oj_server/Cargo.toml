[package]
name = "oj_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dev server: on-demand compile over HTTP, WebSocket HMR channel, file watcher"

[dependencies]
oj_compiler.workspace = true
oj_graph.workspace = true
oj_resolver.workspace = true
oj_cache.workspace = true
oj_css.workspace = true
oj_diag.workspace = true
oj_env.workspace = true
oj_config.workspace = true
oj_js.workspace = true
anyhow.workspace = true
axum.workspace = true
oxc_sourcemap.workspace = true
tokio.workspace = true
notify.workspace = true
serde_json.workspace = true
json-strip-comments = "3.1.2"
blake3.workspace = true
simdutf8.workspace = true
glob = "0.3.4"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# `rustls-tls-native-roots` gives tungstenite's TLS connect path; oj hands it a
# ready ClientConfig, so the roots feature itself is unused. rustls stays on the
# aws-lc-rs provider and platform verifier reqwest already builds (no new crates).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# `server.https` (dev TLS with ALPN h2+http/1.1): the acceptor and the PEM
# reader for the Vite-shaped secure dev server; hyper-util drives axum's
# router per connection where axum::serve would pin HTTP/1.1.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pemfile = "2.2"
hyper = "1.11"
hyper-util = { version = "0.1.20", features = ["server", "server-auto", "http1", "http2", "service", "tokio"] }
futures-util = "0.3"
rolldown = "=1.2.5"
rolldown_common = "=1.2.5"
rolldown_plugin = "=1.2.5"

[dev-dependencies]
tempfile.workspace = true
# test-util: paused time for the debounce test, like crates/oj.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Same version the embedded Deno runtime registers its signal handlers with.
deno_signals = "0.50.0"
# Fork of deno_process (see crates/oj_deno_process): spawn hook + own groups.
deno_process = { package = "oj_deno_process", version = "0.2.33", path = "../oj_deno_process" }
