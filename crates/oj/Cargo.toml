anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
rolldown = "=1.2.5"
rolldown-ariadne = "=0.6.0"
rolldown_common = "=1.2.5"
rolldown_dev_common = "=1.2.5"
rolldown_devtools = "=1.2.5"
rolldown_devtools_action = "=1.2.5"
rolldown_ecmascript = "=1.2.5"
rolldown_ecmascript_utils = "=1.2.5"
rolldown_error = "=1.2.5"
rolldown_fs = "=1.2.5"
rolldown_plugin = "=1.2.5"
rolldown_plugin_asset_module = "=1.2.5"
rolldown_plugin_chunk_import_map = "=1.2.5"
rolldown_plugin_copy_module = "=1.2.5"
rolldown_plugin_data_url = "=1.2.5"
rolldown_plugin_hmr = "=1.2.5"
rolldown_plugin_lazy_compilation = "=1.2.5"
rolldown_plugin_oxc_runtime = "=1.2.5"
rolldown_plugin_utils = "=1.2.5"
rolldown_resolver = "=1.2.5"
rolldown_sourcemap = "=1.2.5"
rolldown_std_utils = "=1.2.5"
