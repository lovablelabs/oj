[package]
name = "oj"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native build tool for React apps"

[[bin]]
name = "oj"
path = "src/main.rs"

[dependencies]
oj_cache.workspace = true
oj_compiler.workspace = true
oj_env.workspace = true
oj_config.workspace = true
oj_resolver.workspace = true
oj_server.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
rolldown = "=1.2.5"
rolldown-ariadne = "=0.6.0"
rolldown_common = "=1.2.5"
rolldown_dev_common = "=1.2.5"
rolldown_devtools = "=1.2.5"
rolldown_devtools_action = "=1.2.5"
rolldown_ecmascript = "=1.2.5"
rolldown_ecmascript_utils = "=1.2.5"
rolldown_error = "=1.2.5"
rolldown_fs = "=1.2.5"
rolldown_plugin = "=1.2.5"
rolldown_plugin_asset_module = "=1.2.5"
rolldown_plugin_chunk_import_map = "=1.2.5"
rolldown_plugin_copy_module = "=1.2.5"
rolldown_plugin_data_url = "=1.2.5"
rolldown_plugin_hmr = "=1.2.5"
rolldown_plugin_lazy_compilation = "=1.2.5"
rolldown_plugin_oxc_runtime = "=1.2.5"
rolldown_plugin_utils = "=1.2.5"
rolldown_resolver = "=1.2.5"
rolldown_sourcemap = "=1.2.5"
rolldown_std_utils = "=1.2.5"
rolldown_tracing = "=1.2.5"
rolldown_utils = "=1.2.5"
string_wizard = "=1.2.5"
arcstr = "1.2.0"
serde_json.workspace = true
blake3.workspace = true
flate2 = "1"
oj_css.workspace = true
axum.workspace = true
notify.workspace = true
tokio-stream = "0.1.19"
futures-util = "0.3"
# Linked (not yet called) so the napi symbols named by build.rs's
# -exported_symbols_list exist in the binary; native addon loading for the
# embedded JS engine builds on this. deno_core needs "v8" spelled out because
# deno_napi asks for it with default-features = false.
deno_napi = "0.190"
deno_core = { version = "0.412", features = ["v8"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"

[build-dependencies]
# Used by build.rs to export Node-API symbols from the oj binary (see there).
deno_napi = "0.190"
# deno_napi pulls deno_core host-side with default-features = false; resolver
# v2 unifies build-dependency features separately, so re-enable "v8" here or
# the host deno_core fails to compile ("either feature `v8` or `quickjs`...").
deno_core = { version = "0.412", features = ["v8"] }
