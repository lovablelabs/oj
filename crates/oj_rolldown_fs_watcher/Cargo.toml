# Fork of rolldown_fs_watcher 1.3.2 (https://github.com/rolldown/rolldown,
# crates/rolldown_fs_watcher) maintained for oj. Its sources are verbatim
# 1.3.2; the one change is in this manifest: the event debouncer is oj's
# fork of rolldown's (oj_notify_debouncer_full), whose thread sleeps while
# no event is queued. Drop the fork once rolldown's debouncer carries that.
# See README.md.

[package]
edition = "2024"
name = "oj_rolldown_fs_watcher"
version.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rolldown_fs_watcher 1.3.2 maintained for oj: verbatim upstream on a debouncer whose thread sleeps while idle. Use upstream rolldown_fs_watcher unless you need this."
homepage = "https://rolldown.rs/"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lovablelabs/oj"

[lib]
name = "rolldown_fs_watcher"
path = "src/lib.rs"
doctest = false

[dependencies.globstar]
version = "0.0.6"

[dependencies.rolldown-notify]
version = "11.0.1"

# oj: in place of rolldown-notify-debouncer-full 0.8.1. The library is named
# notify_debouncer_full as upstream's, so the sources are unchanged.
[dependencies.oj_notify_debouncer_full]
workspace = true

[dependencies.rolldown_common]
version = "=1.3.2"

[dependencies.rolldown_error]
version = "=1.3.2"

[dependencies.rolldown_utils]
version = "=1.3.2"

[dependencies.rustc-hash]
version = "2.1.3"

[dependencies.tracing]
version = "0.1.44"

[dependencies.walkdir]
version = "2.5.0"

# The sources stay upstream's, so they are not held to oj's clippy lints, as
# a registry build would not hold them either.
[lints.rust.deprecated]
level = "allow"
priority = 0

[lints.clippy.all]
level = "allow"
priority = -1
