# Fork of rolldown_dev 1.3.2 (https://github.com/rolldown/rolldown,
# crates/rolldown_dev) maintained for oj, carrying one change: a lazy compile
# queues its rebuild only when rolldown's own lazy compilation is on. oj
# declares the lazy boundaries itself and leaves the modules behind them in
# the graph, so a compile changes nothing a rebuild would pick up. Everything
# else is verbatim 1.3.2; the change is in oj.patch. Drop the fork for
# upstream rolldown_dev once a release can skip that rebuild. See README.md.

[package]
edition = "2024"
name = "oj_rolldown_dev"
version.workspace = true
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rolldown_dev 1.3.2 maintained for oj: a lazy compile does not queue a rebuild when rolldown's own lazy compilation is off. Use upstream rolldown_dev unless you need this."
homepage = "https://rolldown.rs/"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lovablelabs/oj"

[features]
testing = []

[lib]
name = "rolldown_dev"
path = "src/lib.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.103"

[dependencies.arcstr]
version = "1.2.0"
default-features = false

[dependencies.futures]
version = "0.3.32"

[dependencies.rolldown]
version = "=1.3.2"
features = ["experimental"]

[dependencies.rolldown_common]
version = "=1.3.2"

[dependencies.rolldown_dev_common]
version = "=1.3.2"

[dependencies.rolldown_error]
version = "=1.3.2"

# oj: oj's fork of rolldown_fs_watcher 1.3.2 (its debouncer thread sleeps
# while idle); the same types, so the engine is otherwise unchanged.
[dependencies.rolldown_fs_watcher]
workspace = true

[dependencies.rolldown_utils]
version = "=1.3.2"

[dependencies.rustc-hash]
version = "2.1.3"

[dependencies.tokio]
version = "1.52.3"
features = [
    "rt",
    "macros",
    "sync",
    "time",
]
default-features = false

[dependencies.tracing]
version = "0.1.44"

[dev-dependencies.dunce]
version = "1.0.5"

# The sources stay upstream's, so they are not held to oj's clippy lints, as
# a registry build would not hold them either.
[lints.rust.deprecated]
level = "allow"
priority = 0

[lints.clippy.all]
level = "allow"
priority = -1
