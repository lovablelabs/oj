name: release

# Pushing a version tag creates the GitHub release with that
# version's CHANGELOG section as notes, then publishes the workspace crates to
# crates.io (cargo publish --workspace resolves the dependency order itself
# and skips publish = false). After a partial failure, re-run with
# --exclude <already-published> if cargo refuses the duplicates. Auth is
# crates.io Trusted Publishing (OIDC): each crate lists this repo+workflow as
# a publisher, and the auth action mints a run-scoped token — no stored
# secret. A crate's very first publish cannot be trust-configured yet; do
# that one manually with a scoped token, then it joins the flow. A manual
# run (workflow_dispatch) only builds and checks the oj binaries: no release,
# no publish, no upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: github release
    # publish and snapshot-pin need this job, so a manual run skips them too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$ver" ] || { echo "tag v$tag != workspace version $ver" >&2; exit 1; }
      - name: create the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '$0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "oj $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "oj $GITHUB_REF_NAME" --generate-notes
          fi

  publish:
    name: cargo publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every crate to publish is on crates.io already
        # Trusted publishing cannot do a crate's first publish (see the top),
        # and cargo publishes the workspace one crate at a time: a new crate
        # failing mid-run leaves the crates before it published and the ones
        # depending on it not. Stop before uploading anything instead.
        run: |
          set -euo pipefail
          crates=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          [ -n "$crates" ] || { echo "no crates to publish found" >&2; exit 1; }
          missing=""
          for name in $crates; do
            # crates.io asks crawlers for at most one request a second.
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'lovablelabs/oj release' \
              --retry 3 --retry-all-errors "https://crates.io/api/v1/crates/$name" || true)
            case "$code" in
              200) ;;
              404) missing="$missing $name" ;;
              *) echo "crates.io answered $code for $name" >&2; exit 1 ;;
            esac
          done
          [ -z "$missing" ] || {
            echo "never published, publish by hand with a scoped token first:$missing" >&2
            exit 1
          }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --no-verify: verifying a fork crate standalone compiles deno_v8
        # without the v8 feature that only the full workspace unifies (the
        # same wall the manual fork publishes always hit); ci.yml on main is
        # the build gate.
        run: cargo publish --workspace --locked --no-verify

  # oj binaries for consumers that cannot run nix, such as Bazel remote
  # executors, which fetch them by sha256 (the API's asset digest). rusty_v8
  # ships no musl archive, so Linux builds link glibc dynamically and build on
  # Ubuntu 22.04: they run on glibc 2.35 and newer.
  oj-binaries:
    name: oj binary (${{ matrix.target }})
    needs: release
    # Also on a manual run, where release is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fat-LTO link outgrows a 16GB runner and the kernel kills rustc
      # (see nix.yml); swap lets it finish.
      - name: add swap
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 24G /swap-oj
          sudo chmod 600 /swap-oj
          sudo mkswap /swap-oj
          sudo swapon /swap-oj
      # libsqlite3-sys runs bindgen, which needs libclang (flake.nix's
      # bindgenHook); the arm runner image doesn't carry it.
      - name: install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config
      # No rust-cache: a tag run restores only main's caches, which never hold
      # these keys, and its saves would evict the ones main's CI relies on.
      - name: build
        # lcms2-sys links a system lcms2 whenever pkg-config finds one.
        env:
          LCMS2_STATIC: "1"
        run: |
          cargo build --release --locked -p oj
          df -h .
      - name: package
        id: package
        run: |
          out="oj-${{ matrix.target }}.tar.gz"
          ./target/release/oj --version
          # Fail on a runner or Homebrew library (lcms2-sys and libz-sys link
          # one when pkg-config finds it) that consumers would not have.
          if [ "$RUNNER_OS" = Linux ]; then
            ldd target/release/oj | tee /dev/stderr \
              | grep -vE '^\s*(linux-vdso|/lib(64)?/ld-linux|lib(c|m|dl|pthread|rt|gcc_s|z)\.so)' \
              && { echo "unexpected shared library" >&2; exit 1; } || true
          else
            otool -L target/release/oj | tail -n +2 | tee /dev/stderr \
              | grep -vE '^\s*(/usr/lib/|/System/Library/)' \
              && { echo "unexpected shared library" >&2; exit 1; } || true
          fi
          tar -czf "$out" -C target/release oj
          echo "file=$out" >> "$GITHUB_OUTPUT"
      - name: attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: upload to this release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}"

  # The pinned V8 snapshot bundle (issue #211): snapshot creation is
  # run-nondeterministic, so reproducible nix builds consume a prebuilt bundle
  # that flake.nix fetches by SRI hash from a version release. When this
  # release made the committed pin stale (a deno_runtime / deno_core bump),
  # harvest a fresh bundle in this logged run, attest its provenance (the pin
  # cannot be verified by reproduction; `gh attestation verify` is the audit
  # trail), attach it to this release, and open a PR bumping the flake pin.
  # Releases without a deno bump skip in seconds. A rusty_v8-only bump slips
  # past this staleness proxy; the nix build then fails on the manifest check
  # and tools/gen-snapshot-pin.sh is the manual fallback.
  snapshot-pin:
    name: snapshot pin (aarch64-apple-darwin)
    needs: release
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is the committed pin stale for this release?
        id: stale
        run: |
          python3 - <<'EOF'
          import io, os, re, tarfile, urllib.request
          flake = open("flake.nix").read()
          pin = re.search(
              r'aarch64-darwin = \{\s*release = "([^"]*)";\s*file = "([^"]*)";', flake)
          url = f"https://github.com/lovablelabs/oj/releases/download/{pin[1]}/{pin[2]}"
          data = urllib.request.urlopen(url).read()
          tar = tarfile.open(fileobj=io.BytesIO(data), mode="r:gz")
          # basename match: macOS bsdtar may add AppleDouble ._ siblings
          manifest = next(m for m in tar.getmembers()
                          if os.path.basename(m.name) == "OJ_SNAPSHOT_MANIFEST")
          pinned = dict(line.split("=", 1) for line in
                        tar.extractfile(manifest).read().decode().strip().splitlines())
          lock = open("Cargo.lock").read()
          locked = lambda n: re.search(rf'name = "{n}"\nversion = "([^"]+)"', lock)[1]
          stale = any(pinned[c] != locked(c) for c in ("deno_core", "deno_runtime"))
          print(f"pinned={pinned}, stale={stale}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"stale={str(stale).lower()}\n")
          EOF
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.stale.outputs.stale == 'true'
      - name: harvest the pin bundle
        if: steps.stale.outputs.stale == 'true'
        id: harvest
        run: ./tools/gen-snapshot-pin.sh
      - name: attest build provenance
        if: steps.stale.outputs.stale == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.harvest.outputs.pin_file }}
      - name: upload to this release
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.harvest.outputs.pin_file }}"
      - name: open the pin bump PR
        if: steps.stale.outputs.stale == 'true'
        env:
          # A PR opened with the default GITHUB_TOKEN does not trigger CI
          # (documented Actions behavior); set the OJ_BOT_TOKEN secret (a
          # fine-grained PAT with contents+pull-requests write) so the bump
          # PR runs nix.yml, or close/reopen the PR by hand to kick CI.
          # GITHUB_TOKEN also needs the repo setting "Allow GitHub Actions
          # to create and approve pull requests".
          GH_TOKEN: ${{ secrets.OJ_BOT_TOKEN || github.token }}
          PIN_FILE: ${{ steps.harvest.outputs.pin_file }}
          PIN_HASH: ${{ steps.harvest.outputs.pin_hash }}
        run: |
          python3 - <<'EOF'
          import os, re
          release, file, hash = (os.environ["GITHUB_REF_NAME"],
                                 os.environ["PIN_FILE"], os.environ["PIN_HASH"])
          s = open("flake.nix").read()
          block = re.compile(
              r'(aarch64-darwin = \{\s*\n\s*release = ")[^"]*(";\s*\n\s*file = ")[^"]*(";\s*\n\s*hash = ")[^"]*(";)')
          s2, n = block.subn(rf'\g<1>{release}\g<2>{file}\g<3>{hash}\g<4>', s)
          assert n == 1, f"expected one aarch64-darwin pin block, found {n}"
          open("flake.nix", "w").write(s2)
          EOF
          branch="bot/snapshot-pin-aarch64-apple-darwin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.nix
          git commit -m "bump the aarch64-darwin snapshot pin"
          git push -f origin "$branch"
          gh pr create --head "$branch" \
            --title "bump the aarch64-darwin snapshot pin" \
            --body "Regenerated by the release workflow (run ${{ github.run_id }}): asset \`$PIN_FILE\` on the $GITHUB_REF_NAME release, provenance attested (\`gh attestation verify\`). Assets are immutable; old flake revisions keep building." \
            || echo "PR already open; branch force-updated"
          # Lands by itself once CI is green (requires the repo's auto-merge
          # setting; harmless no-op otherwise). Main stays review-protected;
          # this only removes the button-press after checks pass.
          gh pr merge "$branch" --auto --squash \
            || echo "auto-merge not enabled; merge the PR once CI is green"
