name: release

# Pushing a version tag builds oj for every supported target, smoke-tests each
# archive on the runner that built it, and only then creates the GitHub
# release in one step with all binaries, checksums and provenance attached
# (the "build everything, publish once" shape of uv and cargo-dist), with that
# version's CHANGELOG section as notes. It then publishes the workspace crates
# to crates.io (cargo publish --workspace resolves the dependency order itself
# and skips publish = false). After a partial failure, re-run with
# --exclude <already-published> if cargo refuses the duplicates. Auth is
# crates.io Trusted Publishing (OIDC): each crate lists this repo+workflow as
# a publisher, and the auth action mints a run-scoped token — no stored
# secret. A crate's very first publish cannot be trust-configured yet; do
# that one manually with a scoped token, then it joins the flow.
#
# A pull request that touches this file, or a manual run, is a dry run: it
# builds and smoke-tests every archive and uploads them as workflow artifacts,
# but creates no release and publishes nothing.
#
# Archives: oj-<target>.tar.xz, holding oj-<target>/{oj,LICENSE,README.md}.
# The name carries no version, so
# releases/latest/download/oj-<target>.tar.xz is a stable URL (install
# scripts, cargo-binstall's default lookup). Each ships with a .sha256, the
# release carries a combined sha256.sum, and every archive has a GitHub build
# provenance attestation: `gh attestation verify oj-<target>.tar.xz -R lovablelabs/oj`.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$ver" ] || { echo "tag v$tag != workspace version $ver" >&2; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: rusty_v8 ships a prebuilt static V8 per
          # target, and the V8 snapshot is produced at build time by running
          # V8 on the build host, so cross-compiling is not an option.
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # Linux builds run in Ubuntu 22.04 (glibc 2.35), so the binary runs
          # on any distro with glibc >= 2.35, not just the runner's newer one;
          # the smoke test below runs inside that same userland. (A supported
          # release: Debian bullseye's archive went away at its end of life.)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest-m-public
            container: ubuntu:22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 180
    env:
      # oj's minimum macOS; ignored on Linux.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: build dependencies (ubuntu)
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3 cmake \
            binutils xz-utils file clang libclang-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain itself comes from rust-toolchain.toml (rustup installs
      # it on the first cargo call); this only provides rustup.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p oj --target ${{ matrix.target }}
      - name: strip and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="oj-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/oj" "dist/$name/oj"
          cp LICENSE README.md "dist/$name/"
          bin="dist/$name/oj"
          # Strip everything native npm addons do not need: they (rolldown's
          # napi binding) resolve napi_* from this executable at load time.
          # On Linux those live in .dynsym, which `strip` keeps; on macOS a
          # plain `strip` removes all of them (145 napi exports to 0), so it
          # strips only local and debug symbols. Either way, check they survive.
          if [ "$RUNNER_OS" = macOS ]; then
            strip -x -S "$bin"
            exports=$(nm -gU "$bin" | grep -c ' _napi_' || true)
          else
            strip "$bin"
            exports=$(nm -D --defined-only "$bin" | grep -c ' napi_' || true)
            glibc=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "newest glibc symbol required: $glibc"
          fi
          echo "napi exports: $exports"
          [ "$exports" -gt 0 ] || { echo "stripping removed the napi exports native addons need" >&2; exit 1; }
          ls -l "$bin"
          tar -C dist -cf - "$name" | xz -T0 -6 > "dist/$name.tar.xz"
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist && $sum "$name.tar.xz" > "$name.tar.xz.sha256")
          cat "dist/$name.tar.xz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The archive, not the build tree, is what users get: unpack it fresh
      # and prove it runs, prints the version the tag promises, and builds a
      # dependency-free TypeScript app (compiler + bundler, no node_modules).
      - name: smoke test the archive
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.package.outputs.name }}"
          work="$(mktemp -d)"
          tar -C "$work" -xJf "dist/$name.tar.xz"
          oj="$work/$name/oj"
          "$oj" --version
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          "$oj" --version | grep -qx "oj $ver" || { echo "archive reports the wrong version" >&2; exit 1; }
          app="$work/app"
          mkdir -p "$app/src"
          printf '<!doctype html><html><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>\n' > "$app/index.html"
          printf 'const n: number = 41 + 1;\ndocument.getElementById("app")!.textContent = `oj-smoke-${n}`;\n' > "$app/src/main.ts"
          "$oj" build "$app"
          grep -q 'oj-smoke-' "$app"/dist/assets/*.js || { echo "the smoke build produced no bundle" >&2; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/${{ steps.package.outputs.name }}.tar.xz.sha256
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.sha256 > sha256.sum
          cat sha256.sum
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.xz
      # One create with every asset: a release is never visible half-built.
      - name: create the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '$0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "oj $GITHUB_REF_NAME" --notes-file notes.md dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "oj $GITHUB_REF_NAME" --generate-notes dist/*
          fi

  publish:
    name: cargo publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --no-verify: verifying a fork crate standalone compiles deno_v8
        # without the v8 feature that only the full workspace unifies (the
        # same wall the manual fork publishes always hit); ci.yml on main is
        # the build gate.
        run: cargo publish --workspace --locked --no-verify

  # The pinned V8 snapshot bundle (issue #211): snapshot creation is
  # run-nondeterministic, so reproducible nix builds consume a prebuilt bundle
  # that flake.nix fetches by SRI hash from a version release. When this
  # release made the committed pin stale (a deno_runtime / deno_core bump),
  # harvest a fresh bundle in this logged run, attest its provenance (the pin
  # cannot be verified by reproduction; `gh attestation verify` is the audit
  # trail), attach it to this release, and open a PR bumping the flake pin.
  # Releases without a deno bump skip in seconds. A rusty_v8-only bump slips
  # past this staleness proxy; the nix build then fails on the manifest check
  # and tools/gen-snapshot-pin.sh is the manual fallback.
  snapshot-pin:
    name: snapshot pin (aarch64-apple-darwin)
    needs: release
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is the committed pin stale for this release?
        id: stale
        run: |
          python3 - <<'EOF'
          import io, os, re, tarfile, urllib.request
          flake = open("flake.nix").read()
          pin = re.search(
              r'aarch64-darwin = \{\s*release = "([^"]*)";\s*file = "([^"]*)";', flake)
          url = f"https://github.com/lovablelabs/oj/releases/download/{pin[1]}/{pin[2]}"
          data = urllib.request.urlopen(url).read()
          tar = tarfile.open(fileobj=io.BytesIO(data), mode="r:gz")
          # basename match: macOS bsdtar may add AppleDouble ._ siblings
          manifest = next(m for m in tar.getmembers()
                          if os.path.basename(m.name) == "OJ_SNAPSHOT_MANIFEST")
          pinned = dict(line.split("=", 1) for line in
                        tar.extractfile(manifest).read().decode().strip().splitlines())
          lock = open("Cargo.lock").read()
          locked = lambda n: re.search(rf'name = "{n}"\nversion = "([^"]+)"', lock)[1]
          stale = any(pinned[c] != locked(c) for c in ("deno_core", "deno_runtime"))
          print(f"pinned={pinned}, stale={stale}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"stale={str(stale).lower()}\n")
          EOF
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.stale.outputs.stale == 'true'
      - name: harvest the pin bundle
        if: steps.stale.outputs.stale == 'true'
        id: harvest
        run: ./tools/gen-snapshot-pin.sh
      - name: attest build provenance
        if: steps.stale.outputs.stale == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.harvest.outputs.pin_file }}
      - name: upload to this release
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.harvest.outputs.pin_file }}"
      - name: open the pin bump PR
        if: steps.stale.outputs.stale == 'true'
        env:
          # A PR opened with the default GITHUB_TOKEN does not trigger CI
          # (documented Actions behavior); set the OJ_BOT_TOKEN secret (a
          # fine-grained PAT with contents+pull-requests write) so the bump
          # PR runs nix.yml, or close/reopen the PR by hand to kick CI.
          # GITHUB_TOKEN also needs the repo setting "Allow GitHub Actions
          # to create and approve pull requests".
          GH_TOKEN: ${{ secrets.OJ_BOT_TOKEN || github.token }}
          PIN_FILE: ${{ steps.harvest.outputs.pin_file }}
          PIN_HASH: ${{ steps.harvest.outputs.pin_hash }}
        run: |
          python3 - <<'EOF'
          import os, re
          release, file, hash = (os.environ["GITHUB_REF_NAME"],
                                 os.environ["PIN_FILE"], os.environ["PIN_HASH"])
          s = open("flake.nix").read()
          block = re.compile(
              r'(aarch64-darwin = \{\s*\n\s*release = ")[^"]*(";\s*\n\s*file = ")[^"]*(";\s*\n\s*hash = ")[^"]*(";)')
          s2, n = block.subn(rf'\g<1>{release}\g<2>{file}\g<3>{hash}\g<4>', s)
          assert n == 1, f"expected one aarch64-darwin pin block, found {n}"
          open("flake.nix", "w").write(s2)
          EOF
          branch="bot/snapshot-pin-aarch64-apple-darwin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.nix
          git commit -m "bump the aarch64-darwin snapshot pin"
          git push -f origin "$branch"
          gh pr create --head "$branch" \
            --title "bump the aarch64-darwin snapshot pin" \
            --body "Regenerated by the release workflow (run ${{ github.run_id }}): asset \`$PIN_FILE\` on the $GITHUB_REF_NAME release, provenance attested (\`gh attestation verify\`). Assets are immutable; old flake revisions keep building." \
            || echo "PR already open; branch force-updated"
          # Lands by itself once CI is green (requires the repo's auto-merge
          # setting; harmless no-op otherwise). Main stays review-protected;
          # this only removes the button-press after checks pass.
          gh pr merge "$branch" --auto --squash \
            || echo "auto-merge not enabled; merge the PR once CI is green"
