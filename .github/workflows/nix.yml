name: nix

# Build the flake package per platform so a broken flake never reaches a
# consumer. Binary-cache publishing is the consumer's infra concern.
on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: build
        run: nix build .#oj -L
      - name: smoke
        run: ./result/bin/oj --version
      # The vendored rolldown must ride the binary's runtime closure (the
      # embedded OJ_VENDORED_ROLLDOWN store path), or installed oj builds
      # would fail vite-7 Start apps that a `nix build` checkout serves.
      - name: vendored rolldown is a runtime dependency
        run: nix-store --query --requisites ./result | grep -q oj-rolldown-vendor
