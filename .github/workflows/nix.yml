name: nix

# Build the flake package per platform so a broken flake never reaches a
# consumer. Binary-cache publishing is the consumer's infra concern.
on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: build
        run: nix build .#oj -L
      - name: smoke
        run: ./result/bin/oj --version
      # The vendored rolldown must ride the binary's runtime closure (the
      # embedded OJ_VENDORED_ROLLDOWN store path), or installed oj builds
      # would fail vite-7 Start apps that a `nix build` checkout serves.
      - name: vendored rolldown is a runtime dependency
        run: nix-store --query --requisites ./result | grep -q oj-rolldown-vendor
      # And the hand-curated vendor layout must actually build a vite-7 Start
      # app: the flake's parts list is maintained by hand, so a missing
      # runtime dependency or a broken tar layout has to fail here, not on
      # every nix-installed oj.
      # OJ_TEST_EMBEDDED additionally builds with no env var at all, so the
      # binary's compile-time embedded default (the production nix-install
      # path) is what serves — plain env inheritance would keep the Rust
      # plumbing untested otherwise.
      - name: vendored rolldown builds a vite-7 Start app
        run: |
          nix build .#rolldown-vendor -o result-vendor
          OJ_BIN=./result/bin/oj OJ_TEST_VENDORED_ROLLDOWN="$(readlink -f result-vendor)" \
            OJ_TEST_EMBEDDED=1 node e2e/vendored-rolldown.mjs
