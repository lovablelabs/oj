name: nix

# Build the flake package per platform so a broken flake never reaches a
# consumer. Binary-cache publishing is the consumer's infra concern.
on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "e2e/fixtures/start-app/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "e2e/fixtures/start-app/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest-m-public
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: build
        run: nix build .#oj -L
      - name: smoke
        run: ./result/bin/oj --version
      # The store binary bundles Start apps with the rolldown linked into it:
      # building the fixture proves it needs nothing at run time beyond the
      # app's own install.
      - name: the store binary builds the Start fixture
        run: |
          npm ci --prefix e2e/fixtures/start-app --no-audit --no-fund
          ./result/bin/oj build e2e/fixtures/start-app
          test -s e2e/fixtures/start-app/dist/server.mjs
