name: snapshot-pin

# Regenerate the pinned V8 snapshot bundle (issue #211) after a deno_runtime /
# deno_core / rusty_v8 bump. Snapshot creation is run-nondeterministic, so the
# harvest happens once per bump — here, in a logged Actions run rather than on
# a developer laptop — and lands as an immutable asset on the `snapshot-pins`
# release (names embed the blob hash; nothing is ever overwritten, so old
# flake revisions keep building) plus a PR bumping the file+hash in flake.nix.
# The asset also gets a build-provenance attestation: the pin cannot be
# verified by reproduction (that is the whole problem), so
# `gh attestation verify <bundle> -R lovablelabs/oj` is the audit trail for
# which workflow and commit produced the bytes. Manual trigger: run it when
# the nix build fails with a pin manifest mismatch (deno's own flake refreshes
# its rusty_v8 hashes the same manual way).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  pin:
    # One job per pinned target; today only aarch64-apple-darwin (the darwin
    # cache's two-builder agreement is the only consumer of reproducibility).
    name: harvest + upload (aarch64-apple-darwin)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: harvest the pin bundle
        id: harvest
        run: ./tools/gen-snapshot-pin.sh
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.harvest.outputs.pin_file }}
      - name: upload to the snapshot-pins release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload snapshot-pins "${{ steps.harvest.outputs.pin_file }}"
      - name: bump the pin in flake.nix
        env:
          PIN_FILE: ${{ steps.harvest.outputs.pin_file }}
          PIN_HASH: ${{ steps.harvest.outputs.pin_hash }}
        run: |
          python3 - <<'EOF'
          import os, re
          file, hash = os.environ["PIN_FILE"], os.environ["PIN_HASH"]
          s = open("flake.nix").read()
          block = re.compile(
              r'(aarch64-darwin = \{\s*\n\s*file = ")[^"]*(";\s*\n\s*hash = ")[^"]*(";)')
          s2, n = block.subn(rf'\g<1>{file}\g<2>{hash}\g<3>', s)
          assert n == 1, f"expected one aarch64-darwin pin block, found {n}"
          open("flake.nix", "w").write(s2)
          EOF
          git diff --stat flake.nix
      - name: open the pin bump PR
        env:
          # A PR opened with the default GITHUB_TOKEN does not trigger CI
          # (documented Actions behavior); set the OJ_BOT_TOKEN secret (a
          # fine-grained PAT with contents+pull-requests write) so the bump
          # PR runs nix.yml, or close/reopen the PR by hand to kick CI.
          # GITHUB_TOKEN also needs the repo setting "Allow GitHub Actions
          # to create and approve pull requests".
          GH_TOKEN: ${{ secrets.OJ_BOT_TOKEN || github.token }}
        run: |
          branch="bot/snapshot-pin-aarch64-apple-darwin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.nix
          git commit -m "bump the aarch64-darwin snapshot pin"
          git push -f origin "$branch"
          gh pr create --head "$branch" \
            --title "bump the aarch64-darwin snapshot pin" \
            --body "Regenerated by the snapshot-pin workflow (run ${{ github.run_id }}): asset \`${{ steps.harvest.outputs.pin_file }}\` on the snapshot-pins release, provenance attested (\`gh attestation verify\`). Assets are immutable; old flake revisions keep building." \
            || echo "PR already open; branch force-updated"
